# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# maps-bulk-ingest-embedder — self-hosted text embedder.
#
# ADR-2605011500 §Phase-1.3 (no-CF-API path).
#
# Loads BAAI/bge-base-en-v1.5 (768-dim, ~440 MB) once at startup and serves
# `POST /embed { texts: [...] }`. Two callers:
#   1. CronJobs maps-search-ivf-{incremental,retrain} → cluster-internal
#      DNS http://bulk-ingest-embedder.maps-bulk-ingest.svc:8080
#   2. maps Worker (CF) → public cf-tunnel https://embedder.etzhayyim.com/embed
#      (see embedder-tunnel.yaml in 50-infra/vultr/cloudflared/)
#
# Required Secret keys in maps-bulk-ingest-credentials:
#   EMBED_AUTH_TOKEN  — bearer guarding /embed; Worker + tunnel ingress send
#                       the same value as Authorization: Bearer.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-ingest-embedder
  namespace: maps-bulk-ingest
  labels:
    app.kubernetes.io/name: bulk-ingest-embedder
    app.kubernetes.io/part-of: maps
spec:
  replicas: 1
  strategy:
    type: Recreate                # ~440 MB model load → no rolling
  selector:
    matchLabels:
      app.kubernetes.io/name: bulk-ingest-embedder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulk-ingest-embedder
    spec:
      imagePullSecrets:
        - name: ghcr-pull

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "osm-ingest"
          effect: "NoSchedule"
      containers:
        - name: embedder
          image: ghcr.io/etzhayyim/maps-bulk-ingest:1.5.1
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/workers/embedder_serve.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: maps-bulk-ingest-credentials
          env:
            - name: EMBED_MODEL
              value: "BAAI/bge-base-en-v1.5"
            - name: EMBED_PORT
              value: "8080"
            - name: EMBED_MAX_BATCH
              value: "64"
            - name: EMBED_MAX_TEXT_LEN
              value: "1000"
            - name: EMBED_CACHE_DIR
              value: /tmp/hf-cache
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90       # cold load can take ~30-60s
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12          # allow up to 2 min of model load
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bulk-ingest-embedder
  namespace: maps-bulk-ingest
  labels:
    app.kubernetes.io/name: bulk-ingest-embedder
    app.kubernetes.io/part-of: maps
spec:
  selector:
    app.kubernetes.io/name: bulk-ingest-embedder
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
