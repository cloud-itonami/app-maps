# maps-bulk-ingest-ferry-routes — resident worker pod
#
# Queries OSM Overpass for relation[route=ferry] worldwide (paginated by
# continent bbox) + ferry_terminal / harbour nodes; INSERTs into
# RisingWave vertex_spatial as SeaRoute / Port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-ingest-ferry-routes
  namespace: maps-bulk-ingest
  labels:
    app.kubernetes.io/name: bulk-ingest-ferry-routes
    app.kubernetes.io/part-of: maps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulk-ingest-ferry-routes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulk-ingest-ferry-routes
    spec:
      imagePullSecrets:
        - name: ghcr-pull

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "osm-ingest"
          effect: "NoSchedule"
      containers:
        - name: dumper
          image: ghcr.io/etzhayyim/maps-bulk-ingest:1.2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/workers/ferry_routes_dumper.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: maps-bulk-ingest-credentials
          env:
            - name: B2_PREFIX
              value: maps-bulk-ingest/ferry-routes
            - name: CONTINENT_BBOX
              value: ALL
            - name: OVERPASS_TIMEOUT_S
              value: "600"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: 1
              memory: 2Gi
              ephemeral-storage: 5Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bulk-ingest-ferry-routes
  namespace: maps-bulk-ingest
spec:
  selector:
    app.kubernetes.io/name: bulk-ingest-ferry-routes
  ports:
    - port: 8080
      targetPort: 8080
      name: http
