# maps-bulk-ingest-geonames — resident worker pod
#
# Downloads geonames.org/export/dump/{DATASET}.zip (default cities1000,
# 167k rows, ~25MB compressed) and INSERTs into RisingWave vertex_spatial.
#
# Switch GEONAMES_DATASET env to allCountries for full 12M rows
# (~470MB compressed, ~1.7GB uncompressed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-ingest-geonames
  namespace: maps-bulk-ingest
  labels:
    app.kubernetes.io/name: bulk-ingest-geonames
    app.kubernetes.io/part-of: maps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulk-ingest-geonames
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulk-ingest-geonames
    spec:
      imagePullSecrets:
        - name: ghcr-pull

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "osm-ingest"
          effect: "NoSchedule"
      containers:
        - name: dumper
          image: ghcr.io/etzhayyim/maps-bulk-ingest:1.0.8
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/workers/geonames_dumper.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: maps-bulk-ingest-credentials
          env:
            - name: B2_PREFIX
              value: maps-bulk-ingest/geonames
            - name: GEONAMES_DATASET
              value: cities1000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 5Gi
            limits:
              cpu: 1500m
              memory: 4Gi
              ephemeral-storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bulk-ingest-geonames
  namespace: maps-bulk-ingest
spec:
  selector:
    app.kubernetes.io/name: bulk-ingest-geonames
  ports:
    - port: 8080
      targetPort: 8080
      name: http
