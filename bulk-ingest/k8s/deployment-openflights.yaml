# maps-bulk-ingest-openflights — resident worker pod
#
# Downloads OpenFlights airports.dat (~7.7K) + routes.dat (~67K) +
# airlines.dat (~6K) and INSERTs into RisingWave vertex_spatial as
# Airport / AirRoute. ODbL license.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-ingest-openflights
  namespace: maps-bulk-ingest
  labels:
    app.kubernetes.io/name: bulk-ingest-openflights
    app.kubernetes.io/part-of: maps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulk-ingest-openflights
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulk-ingest-openflights
    spec:
      imagePullSecrets:
        - name: ghcr-pull

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "osm-ingest"
          effect: "NoSchedule"
      containers:
        - name: dumper
          image: ghcr.io/etzhayyim/maps-bulk-ingest:1.2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/workers/openflights_dumper.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: maps-bulk-ingest-credentials
          env:
            - name: B2_PREFIX
              value: maps-bulk-ingest/openflights
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: 1
              memory: 2Gi
              ephemeral-storage: 5Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bulk-ingest-openflights
  namespace: maps-bulk-ingest
spec:
  selector:
    app.kubernetes.io/name: bulk-ingest-openflights
  ports:
    - port: 8080
      targetPort: 8080
      name: http
