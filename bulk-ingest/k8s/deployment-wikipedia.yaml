# maps-bulk-ingest-wikipedia — resident worker pod
#
# Iterates 107+ Wikipedia langs, downloading geo_tags.sql.gz +
# page.sql.gz dumps from dumps.wikimedia.org, joining to (lat, lon, title),
# writing parquet shards to B2, and COPY-loading into RisingWave.
#
# Resource: same shape as wikidata pod; smaller because geo_tags is
# already filtered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-ingest-wikipedia
  namespace: maps-bulk-ingest
  labels:
    app.kubernetes.io/name: bulk-ingest-wikipedia
    app.kubernetes.io/part-of: maps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulk-ingest-wikipedia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulk-ingest-wikipedia
    spec:

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "osm-ingest"
          effect: "NoSchedule"

      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: dumper
          image: ghcr.io/etzhayyim/maps-bulk-ingest:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/workers/wikipedia_dumper.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: maps-bulk-ingest-credentials
          env:
            - name: B2_BUCKET
              value: etzhayyim-nats
            - name: B2_PREFIX
              value: maps-bulk-ingest/wikipedia
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 20Gi
            limits:
              cpu: 1
              memory: 2Gi
              ephemeral-storage: 40Gi
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bulk-ingest-wikipedia
  namespace: maps-bulk-ingest
spec:
  selector:
    app.kubernetes.io/name: bulk-ingest-wikipedia
  ports:
    - port: 8080
      targetPort: 8080
      name: http
